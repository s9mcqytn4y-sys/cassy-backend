name: Ops - Demo Uptime Check

# A failed run is the alert: GitHub emails the owner when a scheduled workflow fails.
# Supplemented by the host-side cron health check in ../Docker/Backup/CassyBackupDemo.cron and ../Docker/Monitoring/.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-uptime
  cancel-in-progress: true

jobs:
  check:
    name: Demo API, web and Midtrans webhook reachable
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VPS_STRICT_UPTIME: ${{ vars.VPS_STRICT_UPTIME }}
    steps:
      - name: API ready
        run: |
          status=$(curl -s -o /tmp/ready.json -w '%{http_code}' --retry 2 --retry-delay 15 --max-time 15 https://demo.abbdullaziz.online/health/ready || echo "000")
          if [ "$status" = "530" ] && [ "${VPS_STRICT_UPTIME:-false}" != "true" ]; then
            echo "Demo tunnel is offline (HTTP 530 - local WSL asleep); skipping failure noise until VPS 24/7 cutover."
            exit 0
          fi
          [ "$status" = "200" ] || { echo "Unexpected status $status"; exit 1; }
          cat /tmp/ready.json
          grep -q '"database":"connected"' /tmp/ready.json

      - name: Guest web serves
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 15 --max-time 15 https://demo.abbdullaziz.online/ || echo "000")
          if [ "$status" = "530" ] && [ "${VPS_STRICT_UPTIME:-false}" != "true" ]; then
            echo "Demo web tunnel offline (HTTP 530); skipping."
            exit 0
          fi
          [ "$status" = "200" ] || { echo "Unexpected web status $status"; exit 1; }

      # An unsigned probe must reach the API and be rejected there (4xx); a 5xx means Midtrans could not deliver.
      - name: Midtrans webhook reaches the API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST -H 'Content-Type: application/json' \
            -d '{}' https://demo.abbdullaziz.online/api/v1/payments/midtrans/webhook/central-cafe)
          echo "webhook probe: $code"
          if [ "$code" = "530" ] && [ "${VPS_STRICT_UPTIME:-false}" != "true" ]; then
            echo "Demo webhook tunnel offline (HTTP 530); skipping."
            exit 0
          fi
          [ "$code" -ge 400 ] && [ "$code" -lt 500 ]
